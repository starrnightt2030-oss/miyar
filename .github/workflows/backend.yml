# تجهيز الخادم الأونلاين على Supabase: قاعدة البيانات + الدوال + مفاتيح الإشعارات + ملف إعداد التطبيق
# يعمل تلقائياً عند تعديل مجلد supabase، أو يدوياً من تبويب Actions
name: تجهيز الخادم الأونلاين
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/backend.yml']
permissions:
  contents: write
concurrency: backend
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: التحقق من الأسرار
        id: chk
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then echo "::notice::الخادم الأونلاين لم يُجهَّز بعد — تم التخطي. أضف الأسرار ثم شغّل هذا السير يدوياً:$missing"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "::error::أضف هذه الأسرار في Settings > Secrets and variables > Actions:$missing"; exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.chk.outputs.ok == 'true'
        with:
          version: latest
      - name: ربط المشروع
        if: steps.chk.outputs.ok == 'true'
        run: supabase link --project-ref "$REF" --password "$SUPABASE_DB_PASSWORD"
      - name: قاعدة البيانات (الجداول وسياسات الأمان)
        if: steps.chk.outputs.ok == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: مفاتيح الإشعارات (تُنشأ مرة واحدة فقط)
        if: steps.chk.outputs.ok == 'true'
        run: |
          if supabase secrets list --project-ref "$REF" | grep -q VAPID_PRIVATE; then
            echo "مفاتيح VAPID موجودة"
          else
            KEYS=$(npx --yes web-push@3.6.7 generate-vapid-keys --json)
            supabase secrets set --project-ref "$REF" VAPID_PUBLIC="$(echo "$KEYS" | jq -r .publicKey)" VAPID_PRIVATE="$(echo "$KEYS" | jq -r .privateKey)"
          fi
      - name: مفاتيح الذكاء الاصطناعي على الخادم (أي واحد أو أكثر)
        if: steps.chk.outputs.ok == 'true'
        run: |
          n=0
          if [ -n "$ANTHROPIC_API_KEY" ]; then supabase secrets set --project-ref "$REF" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"; n=$((n+1)); fi
          if [ -n "$OPENAI_API_KEY" ]; then supabase secrets set --project-ref "$REF" OPENAI_API_KEY="$OPENAI_API_KEY"; n=$((n+1)); fi
          if [ -n "$GEMINI_API_KEY" ]; then supabase secrets set --project-ref "$REF" GEMINI_API_KEY="$GEMINI_API_KEY"; n=$((n+1)); fi
          [ "$n" = "0" ] && echo "::warning::لم يُضف أي مفتاح ذكاء اصطناعي — التوليد عبر الخادم لن يعمل (يمكن إضافة مفتاح على كل جهاز من الإعدادات)" || echo "مفاتيح مضبوطة: $n"
      - name: إعداد الدخول (بدون رسالة تأكيد — موافقة المدير تكفي)
        if: steps.chk.outputs.ok == 'true'
        run: |
          SITE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          curl -sS -f -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"mailer_autoconfirm\":true,\"site_url\":\"$SITE\",\"uri_allow_list\":\"$SITE**\"}" > /dev/null || echo "::warning::تعذّر ضبط إعدادات الدخول تلقائياً — عطّل Confirm email يدوياً من Authentication > Providers > Email"
      - name: نشر الدوال
        if: steps.chk.outputs.ok == 'true'
        run: supabase functions deploy --project-ref "$REF" --no-verify-jwt
      - name: ملف إعداد التطبيق config.json
        if: steps.chk.outputs.ok == 'true'
        run: |
          ANON=$(supabase projects api-keys --project-ref "$REF" -o json | jq -r '(first(.[] | select(.name=="anon") | .api_key)) // (first(.[] | select(.type=="publishable") | .api_key))')
          jq -n --arg url "https://$REF.supabase.co" --arg key "$ANON" '{url:$url, anonKey:$key}' > config.json
          if ! git diff --quiet -- config.json || [ -n "$(git status --porcelain config.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config.json
            git commit -m "إعداد الاتصال بالخادم الأونلاين"
            git push
          fi
          echo "تم — الخادم جاهز: https://$REF.supabase.co"
