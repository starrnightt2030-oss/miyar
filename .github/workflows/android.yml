# بناء تطبيق الأندرويد (APK) ونشره في Releases تلقائياً عند تعديل مجلد android
name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: مفتاح التوقيع الثابت (من Secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_SECRET: ${{ secrets.ANDROID_KS_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_SECRET" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            echo "KS_PASS=$KS_SECRET" >> "$GITHUB_ENV"
            echo "STABLE=1" >> "$GITHUB_ENV"
          else
            # بدون المفتاح الثابت: نبني للتجربة فقط ولا ننشر — حتى لا يصل للناس APK لا يثبت فوق نسختهم
            echo "::warning::لا يوجد ANDROID_KEYSTORE_B64 و ANDROID_KS_PASS في Secrets — بناء تجريبي بدون نشر"
            P=$(openssl rand -hex 16); echo "::add-mask::$P"
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks.jks" -alias examstudio -keyalg RSA -keysize 2048 -validity 36500 -storepass "$P" -keypass "$P" -dname "CN=Mohamed-Eldawly, O=Exam Studio, C=EG"
            echo "KS_PASS=$P" >> "$GITHUB_ENV"
            echo "STABLE=0" >> "$GITHUB_ENV"
          fi
          echo "KS_FILE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"
      - name: بناء APK
        working-directory: android
        env:
          VCODE: ${{ github.run_number }}
          VNAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: تجهيز الملف
        run: cp android/app/build/outputs/apk/release/app-release.apk ExamStudio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ExamStudio-apk
          path: ExamStudio.apk
      - name: نشر في Releases
        if: env.STABLE == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Exam Studio — Android 1.0.${{ github.run_number }}
          body: |
            تطبيق Exam Studio للأندرويد.
            حمّل ExamStudio.apk وثبّته (اسمح بالتثبيت من مصادر غير معروفة).
            موقّع بمفتاح ثابت: كل نسخة جديدة تتثبت فوق القديمة وبياناتك تفضل زي ما هي.
            محتوى التطبيق (الامتحانات والمميزات) يتحدّث تلقائياً من GitHub، والتطبيق نفسه بينبهك لو فيه APK أحدث.
          files: ExamStudio.apk
          make_latest: true
