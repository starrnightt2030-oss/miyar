<noscript>يحتاج التطبيق إلى تفعيل JavaScript.</noscript>
<script>
/* مراقب التشغيل: لو التطبيق لم يفتح خلال ٨ ثوانٍ تظهر شاشة بالسبب وزر إصلاح لا يمسح البيانات */
(function(){var errs=[];window.__bootErrs=errs;
window.addEventListener('error',function(e){errs.push((e.message||'خطأ')+(e.filename?' — '+e.filename.split('/').pop()+':'+e.lineno:''));});
window.addEventListener('unhandledrejection',function(e){errs.push(String(e.reason&&e.reason.message||e.reason));});
window.__miyarRepair=function(){var j=[];if(navigator.serviceWorker)j.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister();}));}));if(window.caches)j.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x);}));}));Promise.all(j).catch(function(){}).then(function(){location.replace(location.pathname+'?r='+Date.now());});};
setTimeout(function(){if(window.__booted||window.__bootBlocked)return;var a=document.getElementById('app');if(!a)return;
a.innerHTML='<div style="max-width:480px;margin:50px auto;padding:24px;border-radius:16px;background:#fff;border:1px solid #e3e6ee;font-family:sans-serif;line-height:1.8;text-align:center"><b style="font-size:18px">التطبيق تأخر في الفتح</b><p>غالباً بسبب نسخة قديمة محفوظة في المتصفح. اضغط الزر لتنظيف الملفات المؤقتة وإعادة التحميل — <b>بياناتك وأسئلتك لن تُمسح</b>.</p><button onclick="__miyarRepair()" style="font:inherit;font-weight:700;padding:10px 22px;border-radius:10px;border:0;background:#0F7B6C;color:#fff;cursor:pointer">إصلاح وإعادة التحميل</button>'+(errs.length?'<pre dir="ltr" style="text-align:left;white-space:pre-wrap;font-size:12px;background:#f6f7fa;padding:10px;border-radius:8px;margin-top:14px">'+errs.slice(0,6).join('\n').replace(/</g,'&lt;')+'</pre>':'')+'</div>';},8000);})();
</script>
